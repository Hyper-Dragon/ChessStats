# Serves the generated reports. ChessStats writes them next to its executable (/app).
server {
    listen 80 default_server;
    server_name _;

    root /app/ChessStatsResults;
    index index.html;
    charset utf-8;

    # Reports are large, self-contained HTML files.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css text/plain application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }
}
